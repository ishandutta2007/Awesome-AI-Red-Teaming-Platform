<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d17" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>

    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)" rx="16" />

  <!-- Grid Patterns (Dynamic aspect) -->
  <g opacity="0.12">
    <path d="M 0 50 L 1200 50 M 0 100 L 1200 100 M 0 150 L 1200 150 M 0 200 L 1200 200 M 0 250 L 1200 250 M 0 300 L 1200 300 M 0 350 L 1200 350" stroke="#38bdf8" stroke-width="1"/>
    <path d="M 100 0 L 100 400 M 200 0 L 200 400 M 300 0 L 300 400 M 400 0 L 400 400 M 500 0 L 500 400 M 600 0 L 600 400 M 700 0 L 700 400 M 800 0 L 800 400 M 900 0 L 900 400 M 1000 0 L 1000 400 M 1100 0 L 1100 400" stroke="#38bdf8" stroke-width="1"/>
  </g>

  <!-- Animated Scanning Line -->
  <rect x="0" y="0" width="1200" height="40" fill="url(#scanGrad)">
    <animateTransform attributeName="transform" type="translate" from="0 -40" to="0 440" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- Decorative Animated Node Network in Background -->
  <g opacity="0.3">
    <!-- Pulsing Node 1 -->
    <circle cx="150" cy="100" r="4" fill="#ef4444" filter="url(#glow)">
      <animate attributeName="r" values="4;9;4" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
    </circle>
    <line x1="150" y1="100" x2="280" y2="180" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,4"/>

    <!-- Pulsing Node 2 -->
    <circle cx="1050" cy="120" r="5" fill="#38bdf8" filter="url(#glow)">
      <animate attributeName="r" values="5;10;5" dur="4s" repeatCount="indefinite"/>
    </circle>
    <line x1="1050" y1="120" x2="920" y2="220" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,4"/>

    <!-- Pulsing Node 3 -->
    <circle cx="980" cy="320" r="4" fill="#c084fc" filter="url(#glow)">
      <animate attributeName="r" values="4;8;4" dur="3.5s" repeatCount="indefinite"/>
    </circle>

    <!-- Shield Outline in background -->
    <path d="M 600 40 L 680 80 V 160 C 600 220 600 220 600 220 C 600 220 600 220 520 160 V 80 Z" fill="none" stroke="#818cf8" stroke-width="2" opacity="0.25">
      <animate attributeName="stroke-dasharray" values="0,500;500,0" dur="6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Foreground Badge / Header Label -->
  <g transform="translate(600, 75)" text-anchor="middle">
    <rect x="-140" y="-18" width="280" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" opacity="0.9"/>
    <text y="5" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="2">
      🛡️ AI SECURITY &amp; RED TEAMING
    </text>
  </g>

  <!-- Main Title -->
  <text x="600" y="165" text-anchor="middle" fill="url(#titleGrad)" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5" filter="url(#glow)">
    Awesome AI Red Teaming Platform
  </text>

  <!-- Subtitle -->
  <text x="600" y="215" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="500" letter-spacing="0.5">
    Curated SaaS Platforms &amp; Open-Source Tools for LLM Jailbreaking, Prompt Injection &amp; Evals
  </text>

  <!-- Feature Pills / Highlights -->
  <g transform="translate(600, 290)" text-anchor="middle">
    <!-- Pill 1 -->
    <g transform="translate(-320, 0)">
      <rect x="-90" y="-20" width="180" height="40" rx="10" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
      <text y="5" fill="#a5b4fc" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">⚡ LLM Jailbreaks</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(-110, 0)">
      <rect x="-100" y="-20" width="200" height="40" rx="10" fill="#31101e" stroke="#f43f5e" stroke-width="1"/>
      <text y="5" fill="#fecdd3" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">🎯 Prompt Injections</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(110, 0)">
      <rect x="-100" y="-20" width="200" height="40" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
      <text y="5" fill="#a7f3d0" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">🛡️ Guardrails &amp; Evals</text>
    </g>
    <!-- Pill 4 -->
    <g transform="translate(320, 0)">
      <rect x="-90" y="-20" width="180" height="40" rx="10" fill="#451a03" stroke="#f59e0b" stroke-width="1"/>
      <text y="5" fill="#fde68a" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">🤖 Agent Attacks</text>
    </g>
  </g>

  <!-- Footer status line -->
  <text x="600" y="365" text-anchor="middle" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500">
    OWASP LLM Top 10 • NIST AI RMF • MITRE ATLAS Compliant Tooling
  </text>
</svg>
